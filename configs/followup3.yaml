blocks:
- name: decomp_lilim
  instances:
  - family: lilim
    size: 100
  - family: lilim
    size: 200
  budgets:
  - 0.5n
  iter_file: results/iter_budget.json
  diag: true
  algorithms:
    A_INT1_prune: 5
    A_INT2_prior: 5
    A_INT3_noGNNdestroy: 5
- name: decomp_hdarp
  instances:
  - family: malheiros
  budgets:
  - 0.5n
  iter_file: results/iter_budget.json
  diag: true
  algorithms:
    A_INT2_prior: 5
