blocks:
- name: e14_lilim
  instances:
  - family: gen-lilim
    size: valopt
  budgets:
  - 0.25n
  iter_file: results/iter_budget_valopt_lilim.json
  diag: true
  algorithms:
    C2_co@hgnn_l1: 2
    C2_co@hgnn_l02: 2
    C2_co@hom_l1: 2
    C2_co@mlp_l1: 2
