    by_family:
      lilim:
        xi: 0.4
        noise: 0.025
      hdarp:
        xi: 0.2
        noise: 0.0
  C2_co@hgnn_l1:
    by_family:
      lilim:
        xi: 0.4
        noise: 0.025
        guide:
          key: co_hgnn
          K: 999
          lam: 1.0
        gnn_destroy: false
      hdarp:
        xi: 0.2
        noise: 0.0
